            \ de enviar, nunca después.\n4. No hay URLs de API hardcodeadas. Siempre\
            \ desde variables de entorno.\n5. Los componentes del UI Designer se usan\
            \ tal como vienen, sin modificar su estética.\n\n---\nREGLA DE CONSISTENCIA\
